version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: false

linters:
  enable:
    - govet
    - bodyclose
    - errorlint
    - nilerr
    - nilnil
    - durationcheck
    - makezero
    - unconvert
    - gocheckcompilerdirectives
    - goprintffuncname
    - errchkjson
    - unparam
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gocritic
    - revive
    - contextcheck
    - sqlclosecheck
    - noctx
    - gosec
    - gocyclo
  exclusions:
    paths:
      - llm-shared
    rules:
      - linters:
          - misspell
        text: "LISTEND"
      - path: db/db\.go
        linters:
          - noctx
      - path: irc/manager\.go
        linters:
          - contextcheck
  settings:
    govet:
      enable:
        - shadow
    gocyclo:
      min-complexity: 40
    gosec:
      excludes:
        - G120
        - G201
        - G202
        - G301
        - G302
        - G304
        - G402
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - exitAfterDefer
        - rangeValCopy
        - hugeParam
        - singleCaseSwitch
        - ifElseChain
        - paramTypeCombine
    revive:
      severity: warning
      rules:
        - name: exported
          severity: warning
          disabled: false
          arguments:
            - "checkPrivateReceivers"
            - "sayRepetitiveInsteadOfStutters"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
