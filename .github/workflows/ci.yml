name: Go CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Run tests with coverage
        run: task test-ci

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: cd web && pnpm install --frozen-lockfile

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Run frontend lint/typecheck
        run: task lint-web

      # The vitest suite runs in browser mode against chromium. pnpm blocks
      # playwright's postinstall (see allowBuilds in web/pnpm-workspace.yaml),
      # so the browser binaries have to be fetched explicitly.
      - name: Install Playwright browsers
        run: cd web && pnpm exec playwright install --with-deps chromium

      # Unit tier only. test-web-integration needs a seeded backend and stays
      # out of CI.
      - name: Run frontend tests
        run: task test-web

      - name: Validate Mermaid documentation
        run: task lint-mermaid

      # shellcheck ships on the GitHub Ubuntu runner images.
      - name: Lint shell scripts
        run: task lint-shell

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m ./...

  apple:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      # build-apple regenerates AppIcon.appiconset from web/public/favicon.svg.
      - name: Install icon renderer
        run: brew install librsvg

      - name: Install SwiftFormat
        # Pinned release binary; brew on the runner image lags and won't upgrade
        # an already-installed formula. Keep in step with --minversion in
        # apple/airbnb.swiftformat.
        run: |
          curl -sSL -o "$RUNNER_TEMP/swiftformat.zip" https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.0/swiftformat.zip
          mkdir -p "$RUNNER_TEMP/swiftformat"
          unzip -q -o "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          # Must precede the runner's preinstalled /opt/homebrew/bin/swiftformat
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          swiftformat --version
          swift --version

      - name: Lint Swift
        run: task lint-apple

      - name: Test native client
        run: task test-apple

      - name: Build native client
        run: task build-apple

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, apple]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: cd web && pnpm install --frozen-lockfile

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      # web-build regenerates the PWA icons from web/public/favicon.svg, so a
      # change to the SVG that was not committed alongside its rasters fails
      # here instead of shipping a stale icon.
      - name: Install icon renderers
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick

      - name: Build
        run: task build-ci
