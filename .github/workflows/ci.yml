name: Go CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Run tests with coverage
        run: task test-ci

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: cd web && pnpm install --frozen-lockfile

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Run frontend lint/typecheck
        run: task lint-web

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m ./...

  apple:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Install SwiftFormat
        # Pinned release binary; brew on the runner image lags and won't upgrade
        # an already-installed formula. Keep in step with --minversion in
        # apple/airbnb.swiftformat.
        run: |
          curl -sSL -o /tmp/swiftformat.zip https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.0/swiftformat.zip
          unzip -q -o /tmp/swiftformat.zip -d /usr/local/bin
          swiftformat --version
          swift --version

      - name: Lint Swift
        run: task lint-apple

      - name: Test native client
        run: task test-apple

      - name: Build native client
        run: task build-apple

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, apple]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: cd web && pnpm install --frozen-lockfile

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Build
        run: task build-ci
