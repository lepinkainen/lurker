<!doctype html>
<html lang="en" data-accent="blue" data-density="dense">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lurker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app" class="app">
      <aside id="sidebar" class="sidebar" aria-label="Networks">
        <div id="sb-scroll" class="sbscroll"></div>
        <div class="sb-footer">
          <button type="button" title="Account settings">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3">
              <circle cx="8" cy="8" r="2" />
              <path d="M8 1.5v1.3M8 13.2v1.3M1.5 8h1.3M13.2 8h1.3M3.4 3.4l.9.9M11.7 11.7l.9.9M3.4 12.6l.9-.9M11.7 4.3l.9-.9" stroke-linecap="round" />
            </svg>
            <span>Account settings &amp; info</span>
          </button>
        </div>
      </aside>

      <main id="main" class="mainpane">
        <header id="buffer-header" class="topicbar">
          <div class="title">
            <div id="buffer-name" class="chan">—</div>
          </div>
          <div id="buffer-topic" class="topic" title="Click to edit topic">
            <span class="topictext">—</span>
            <span class="edit" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4">
                <path d="M2 14l3.5-1L13 5.5 10.5 3 3 10.5 2 14z" stroke-linejoin="round" />
                <path d="M9.5 4L12 6.5" />
              </svg>
            </span>
          </div>
          <div class="actions">
            <span id="buffer-memcount" class="memcount" title="Members" hidden>
              <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4">
                <circle cx="6" cy="6" r="2.5" />
                <path d="M1.5 14c.5-2.5 2.3-4 4.5-4s4 1.5 4.5 4" />
                <circle cx="11" cy="5" r="2" />
                <path d="M10.5 10c2 0 3.5 1.3 4 3" />
              </svg>
              <span id="member-count-inline">0</span>
            </span>
            <button class="icbtn" type="button" title="Channel info" aria-label="Channel info">
              <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.4">
                <circle cx="8" cy="8" r="6" />
                <path d="M8 7.5v4M8 5v.5" stroke-linecap="round" />
              </svg>
            </button>
            <button id="toggle-members" class="icbtn toggled" type="button" title="Toggle member list" aria-label="Toggle member list">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4">
                <circle cx="6" cy="6" r="2.5" />
                <path d="M1.5 14c.5-2.5 2.3-4 4.5-4s4 1.5 4.5 4" />
                <circle cx="11" cy="5" r="2" />
                <path d="M10.5 10c2 0 3.5 1.3 4 3" />
              </svg>
            </button>
          </div>
        </header>

        <section id="messages" class="messages" aria-live="polite"></section>
        <section id="status-view" class="statusview" hidden></section>

        <form id="input-form" class="inputbar">
          <div id="cmd-pop" class="cmdpop" hidden></div>
          <div class="row">
            <span class="prompt"><span id="input-nick" class="you">—</span></span>
            <input
              id="input"
              class="msgin"
              type="text"
              autocomplete="off"
              placeholder="Message channel"
              disabled
            />
            <div class="actions">
              <button class="icbtn" type="button" title="Slash commands" aria-label="Slash commands">
                <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4">
                  <path d="M10 3L6 13" stroke-linecap="round" />
                </svg>
              </button>
              <button class="icbtn" type="submit" title="Send" aria-label="Send">
                <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4">
                  <path d="M2 8l12-5-5 12-2-5-5-2z" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
          </div>
        </form>
      </main>

      <aside id="member-pane" class="memberpane" aria-label="Members">
        <div class="mheader">
          <span class="lbl">members</span>
          <span id="member-count" class="count">0</span>
        </div>
        <div id="member-list" class="mlist"></div>
      </aside>
    </div>

    <button id="tweaks-tab" class="tweakstab" type="button" title="Open tweaks">
      <span class="gear" aria-hidden="true">⚙</span>
      <span>Tweaks</span>
    </button>
    <div id="tweaks-panel" class="tweakspanel" hidden>
      <div class="th">
        <span>Tweaks</span>
        <button id="tweaks-close" class="close" type="button" aria-label="Close tweaks">×</button>
      </div>
      <div class="tb">
        <div class="field">
          <label>Accent</label>
          <div class="seg" data-tweak="accent">
            <button type="button" data-value="blue">Blue</button>
            <button type="button" data-value="green">Green</button>
            <button type="button" data-value="magenta">Magenta</button>
          </div>
        </div>
        <div class="field">
          <label>Density</label>
          <div class="seg" data-tweak="density">
            <button type="button" data-value="dense">Dense</button>
            <button type="button" data-value="balanced">Balanced</button>
            <button type="button" data-value="comfortable">Roomy</button>
          </div>
        </div>
        <div class="switch" data-tweak="showSeconds">
          <span class="lbl">Show seconds in timestamps</span>
          <span class="sw" aria-hidden="true"></span>
        </div>
        <div class="switch" data-tweak="showMemberList">
          <span class="lbl">Show member list</span>
          <span class="sw" aria-hidden="true"></span>
        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
