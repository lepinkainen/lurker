<!doctype html>
<html lang="en" data-density="dense">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lurker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true" focusable="false" width="0" height="0" style="position:absolute" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="ic-gear" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
          <circle cx="8" cy="8" r="2" />
          <path d="M8 1.5v1.3M8 13.2v1.3M1.5 8h1.3M13.2 8h1.3M3.4 3.4l.9.9M11.7 11.7l.9.9M3.4 12.6l.9-.9M11.7 4.3l.9-.9" stroke-linecap="round" />
        </symbol>
        <symbol id="ic-pencil" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
          <path d="M2 14l3.5-1L13 5.5 10.5 3 3 10.5 2 14z" stroke-linejoin="round" />
          <path d="M9.5 4L12 6.5" />
        </symbol>
        <symbol id="ic-people" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
          <circle cx="6" cy="6" r="2.5" />
          <path d="M1.5 14c.5-2.5 2.3-4 4.5-4s4 1.5 4.5 4" />
          <circle cx="11" cy="5" r="2" />
          <path d="M10.5 10c2 0 3.5 1.3 4 3" />
        </symbol>
        <symbol id="ic-info" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
          <circle cx="8" cy="8" r="6" />
          <path d="M8 7.5v4M8 5v.5" stroke-linecap="round" />
        </symbol>
        <symbol id="ic-slash" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
          <path d="M10 3L6 13" stroke-linecap="round" />
        </symbol>
        <symbol id="ic-send" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
          <path d="M2 8l12-5-5 12-2-5-5-2z" stroke-linejoin="round" />
        </symbol>
        <symbol id="ic-lock" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="7" width="10" height="7" rx="1.5" />
          <path d="M5 7V5a3 3 0 0 1 6 0v2" />
        </symbol>
      </defs>
    </svg>

    <div id="app" class="app">
      <aside id="sidebar" class="sidebar" aria-label="Networks">
        <div id="sidebar-status" class="sb-status" aria-label="Connectivity status">
          <div id="backend-status" class="sb-status-item" title="Backend connection status">
            <span class="sb-status-dot" aria-hidden="true"></span>
            <span class="sb-status-label">Backend</span>
            <span id="backend-status-text" class="sb-status-value">Connecting…</span>
          </div>
          <div id="tailscale-status" class="sb-status-item" title="Tailscale connectivity status">
            <span class="sb-status-dot" aria-hidden="true"></span>
            <span class="sb-status-label">Tailscale</span>
            <span id="tailscale-status-text" class="sb-status-value">Connected</span>
          </div>
          <div id="update-status" class="sb-status-item warn" title="Application update status" hidden>
            <span class="sb-status-dot" aria-hidden="true"></span>
            <span class="sb-status-label">Update</span>
            <span id="update-status-text" class="sb-status-value">Update available</span>
          </div>
        </div>
        <div id="sb-scroll" class="sbscroll"></div>
        <div class="sb-footer">
          <button type="button" title="Account settings">
            <svg class="icon" width="14" height="14" aria-hidden="true" focusable="false"><use href="#ic-gear" /></svg>
            <span>Account settings &amp; info</span>
          </button>
        </div>
      </aside>

      <main id="main" class="mainpane">
        <header id="buffer-header" class="topicbar">
          <div class="title">
            <button id="mobile-menu" class="mobile-menu-btn" type="button" aria-label="Open buffers" title="Open buffers">
              <svg class="icon" width="14" height="14" aria-hidden="true" focusable="false" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
            </button>
            <div id="buffer-name" class="chan">—</div>
          </div>
          <div id="buffer-topic" class="topic" title="Click to edit topic">
            <span class="topictext">—</span>
            <span class="edit" aria-hidden="true">
              <svg class="icon" width="12" height="12" aria-hidden="true" focusable="false"><use href="#ic-pencil" /></svg>
            </span>
          </div>
          <div class="actions">
            <select id="theme-select" class="theme-select" title="Theme" aria-label="Theme"></select>
            <span id="buffer-memcount" class="memcount" title="Members" hidden>
              <svg class="icon" width="12" height="12" aria-hidden="true" focusable="false"><use href="#ic-people" /></svg>
              <span id="member-count-inline">0</span>
            </span>
            <button class="icbtn" type="button" title="Channel info" aria-label="Channel info">
              <svg class="icon" width="13" height="13" aria-hidden="true" focusable="false"><use href="#ic-info" /></svg>
            </button>
            <button id="toggle-members" class="icbtn toggled" type="button" title="Toggle member list" aria-label="Toggle member list">
              <svg class="icon" width="14" height="14" aria-hidden="true" focusable="false"><use href="#ic-people" /></svg>
            </button>
          </div>
        </header>

        <section id="messages" class="messages" aria-live="polite"></section>
        <section id="status-view" class="statusview" hidden></section>

        <form id="input-form" class="inputbar">
          <div id="cmd-pop" class="cmdpop" hidden></div>
          <div class="row">
            <span class="prompt"><span id="input-nick" class="you">—</span></span>
            <input
              id="input"
              class="msgin"
              type="text"
              autocomplete="off"
              placeholder="Message channel"
              disabled
            />
            <div class="actions">
              <button class="icbtn" type="button" title="Slash commands" aria-label="Slash commands">
                <svg class="icon" width="14" height="14" aria-hidden="true" focusable="false"><use href="#ic-slash" /></svg>
              </button>
              <button class="icbtn" type="submit" title="Send" aria-label="Send">
                <svg class="icon" width="14" height="14" aria-hidden="true" focusable="false"><use href="#ic-send" /></svg>
              </button>
            </div>
          </div>
        </form>
      </main>

      <aside id="member-pane" class="memberpane" aria-label="Members">
        <div class="mheader">
          <span class="lbl">members</span>
          <span id="member-count" class="count">0</span>
        </div>
        <div id="member-list" class="mlist"></div>
      </aside>
    </div>


    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
