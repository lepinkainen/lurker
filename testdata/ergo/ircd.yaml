# Minimal Ergo config for lurker integration tests (task test-ergo).
# Based on Ergo's default.yaml, trimmed to: plaintext listener only, no
# connection throttling (tests reconnect rapidly from one IP), in-memory
# message history with CHATHISTORY enabled. NOT for production use.

network:
    name: LurkerTest

server:
    name: ergo.test

    listeners:
        ":6667":

    casemapping: "permissive"

    enforce-utf8: true

    lookup-hostnames: false
    ip-cloaking:
        enabled: false

    max-sendq: 96k

    connection-limits:
        enabled: false

    connection-throttling:
        enabled: false

accounts:
    authentication-enabled: true
    registration:
        enabled: true
        allow-before-connect: true
        throttling:
            enabled: false
        email-verification:
            enabled: false
    multiclient:
        enabled: true
        allowed-by-default: true

channels:
    default-modes: +ntC
    registration:
        enabled: true

datastore:
    path: /tmp/ircd.db
    autoupgrade: true

limits:
    nicklen: 32
    identlen: 20
    channellen: 64
    awaylen: 390
    kicklen: 390
    topiclen: 390
    monitor-entries: 100
    whowas-entries: 100
    chan-list-modes: 60
    registration-messages: 1024
    multiline:
        max-bytes: 4096
        max-lines: 100

history:
    enabled: true
    channel-length: 2048
    client-length: 256
    autoresize-window: 3d
    autoreplay-on-join: 0
    chathistory-maxmessages: 1000
    znc-maxmessages: 2048
    restrictions:
        expire-time: 1w
        query-cutoff: 'none'
        grace-period: 1h
    persistent:
        enabled: false

logging:
    -
        method: stderr
        type: "* -userinput -useroutput"
        level: info
