root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/lurker ."
bin = "./tmp/lurker"
args_bin = ["--web-dir", "./web/dist"]
include_ext = ["go"]
exclude_dir = ["web", "build", "data", "data-test", "tmp", "llm-shared"]
delay = 5000
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"
