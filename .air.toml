root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/lurker ."
bin = "./tmp/lurker"
args_bin = ["--web-dir", "./web/dist"]
include_ext = ["go"]
exclude_dir = ["web", "build", "data", "data-test", "tmp", "llm-shared"]
# Debounce window: air waits this long after a Go edit before rebuilding, and
# folds any further edits in the window into a single rebuild. Kept high because
# a rebuild restarts the process and reconnects to real IRC servers — rapid
# restarts risk a reconnect-flood ban. Raise further if you edit in long bursts.
delay = 15000
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"
