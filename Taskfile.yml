version: '3'

vars:
  APP_NAME: lurker
  BUILD_DIR: build
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  GIT_HASH:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  BUILD_TIME:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -s -w
    -X main.version={{.VERSION}}
    -X main.gitHash={{.GIT_HASH}}
    -X main.buildTime={{.BUILD_TIME}}
  GO_PACKAGES:
    sh: go list ./... | grep -v '^github.com/lepinkainen/lurker/llm-shared/' | tr '\n' ' '

tasks:
  build:
    desc: Run lint, tests, frontend build, then build the local binary (quiet on success)
    silent: true
    cmds:
      - |
        LOG=$(mktemp); trap 'rm -f "$LOG"' EXIT
        step() {
          label=$1; shift
          printf "  %-12s" "$label"
          if "$@" >"$LOG" 2>&1; then echo "ok"; else echo "FAIL"; cat "$LOG"; exit 1; fi
        }
        step lint      task lint
        step test-go   task test
        step test-web  task test-web
        step web-build task web-build
        step build-tui task build-tui
        if [ "$(uname -s)" = "Darwin" ]; then
          step mac-lint  task lint-apple
          step mac-test  task test-apple
          step mac-app   task build-apple
        fi
        mkdir -p {{.BUILD_DIR}}
        step binary    go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.APP_NAME}} .
        echo "Build OK — lint, tests, web build, and local applications"

  build-linux:
    desc: Build the Linux binary into build/
    deps: [build-tui-linux]
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.APP_NAME}}-linux-amd64 .

  build-ci:
    desc: CI build with frontend assets
    deps: [web-build]
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.APP_NAME}} .

  dev:
    desc: Run the service locally
    cmds:
      - go run .

  tui:
    desc: Run the TUI client (reads tui-config.yaml or ~/.config/lurker/tui.yaml)
    cmds:
      - go run ./cmd/tui

  build-tui:
    desc: Build the TUI client binary to build/lurker-tui
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/lurker-tui ./cmd/tui

  test-tui:
    desc: Run Go tests for the TUI client only
    cmds:
      - go test ./cmd/tui/...

  build-tui-linux:
    desc: Build the TUI client Linux binary to build/lurker-tui-linux-amd64
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/lurker-tui-linux-amd64 ./cmd/tui

  build-apple:
    desc: Build the native macOS app (Apple silicon)
    platforms: [darwin]
    cmds:
      - >-
        xcodebuild -quiet
        -project apple/Lurker.xcodeproj
        -scheme Lurker
        -configuration Debug
        -destination 'platform=macOS,arch=arm64'
        -derivedDataPath {{.BUILD_DIR}}/DerivedData
        CODE_SIGNING_ALLOWED=NO
        ONLY_ACTIVE_ARCH=YES
        build

  build-apple-release:
    desc: Build the native macOS app, Release config (Apple silicon, ad-hoc signed)
    platforms: [darwin]
    sources:
      - apple/Lurker.xcodeproj/**/*
      - apple/Lurker/**/*
    generates:
      - "{{.BUILD_DIR}}/DerivedData/Build/Products/Release/Lurker.app/Contents/MacOS/Lurker"
    cmds:
      - >-
        xcodebuild -quiet
        -project apple/Lurker.xcodeproj
        -scheme Lurker
        -configuration Release
        -destination 'platform=macOS,arch=arm64'
        -derivedDataPath {{.BUILD_DIR}}/DerivedData
        CODE_SIGNING_ALLOWED=NO
        ONLY_ACTIVE_ARCH=YES
        build

  install-apple:
    desc: Build the Release app and install it to /Applications (overwrites existing)
    platforms: [darwin]
    deps: [build-apple-release]
    sources:
      - "{{.BUILD_DIR}}/DerivedData/Build/Products/Release/Lurker.app/**/*"
    generates:
      - /Applications/Lurker.app/Contents/MacOS/Lurker
    cmds:
      - rm -rf /Applications/Lurker.app
      - ditto {{.BUILD_DIR}}/DerivedData/Build/Products/Release/Lurker.app /Applications/Lurker.app

  apple-icon:
    desc: Generate the native app icon from the project icon
    platforms: [darwin]
    sources:
      - web/public/favicon.svg
      - scripts/generate-apple-icon.sh
    generates:
      - apple/Lurker/Assets.xcassets/AppIcon.appiconset/icon_512x512@2x.png
    cmds:
      - ./scripts/generate-apple-icon.sh

  test-apple:
    desc: Run native macOS unit tests
    platforms: [darwin]
    cmds:
      - >-
        xcodebuild -quiet
        -project apple/Lurker.xcodeproj
        -scheme Lurker
        -configuration Debug
        -destination 'platform=macOS,arch=arm64'
        -derivedDataPath {{.BUILD_DIR}}/DerivedData
        CODE_SIGNING_ALLOWED=NO
        ONLY_ACTIVE_ARCH=YES
        -only-testing:LurkerTests
        test

  test-apple-ui:
    desc: Run native macOS UI smoke tests with fixture data
    platforms: [darwin]
    cmds:
      - >-
        xcodebuild -quiet
        -project apple/Lurker.xcodeproj
        -scheme Lurker
        -configuration Debug
        -destination 'platform=macOS,arch=arm64'
        -derivedDataPath {{.BUILD_DIR}}/DerivedData
        ONLY_ACTIVE_ARCH=YES
        CODE_SIGN_IDENTITY=-
        CODE_SIGNING_REQUIRED=YES
        AD_HOC_CODE_SIGNING_ALLOWED=YES
        -only-testing:LurkerUITests
        test

  lint-apple:
    desc: Check native Swift formatting
    platforms: [darwin]
    cmds:
      - xcrun swift-format lint --strict --recursive apple/Lurker apple/LurkerTests apple/LurkerUITests

  package-apple:
    desc: Build, Developer ID sign, notarize, and staple a macOS DMG
    platforms: [darwin]
    deps: [apple-icon]
    env:
      LURKER_VERSION: '{{.VERSION}}'
    cmds:
      - ./scripts/package-apple.sh

  dev-web:
    desc: Build the frontend then run backend via air (restarts 5s after Go edits settle)
    deps: [web-build]
    cmds:
      - air

  seed-test:
    desc: Seed ./data-test (override with SEED_DIR=...) with fake networks, buffers, and messages
    vars:
      SEED_DIR: '{{.SEED_DIR | default "./data-test"}}'
    cmds:
      - go run ./cmd/seedtest --data-dir {{.SEED_DIR}} --reset

  fake-ircd:
    desc: Run minimal IRC server on :6667 with message injection on :6668
    cmds:
      - go run ./cmd/fakeircd

  dev-test:
    desc: Build the frontend then run backend against seeded ./data-test
    deps: [web-build]
    env:
      DATA_DIR: ./data-test
      CONFIG_PATH: ./data-test/config.yaml
    cmds:
      - go run . --web-dir ./web/dist

  web-install:
    desc: Install frontend dependencies with pnpm
    cmds:
      - cd web && pnpm install

  web-dev:
    desc: Run the Vite dev server for the frontend
    cmds:
      - cd web && pnpm dev

  gen-palette:
    desc: Generate web/src/nick-palette.ts with perceptually-spaced OKLCH hues
    cmds:
      - node scripts/gen-nick-palette.mjs
      - cd web && pnpm exec biome format --write src/nick-palette.ts

  web-build:
    desc: Build the frontend into web/dist
    deps: [gen-palette]
    cmds:
      - cd web && pnpm build

  test:
    desc: Run the test suite (excluding llm-shared)
    cmds:
      - go test {{.GO_PACKAGES}}

  test-one:
    desc: 'Run a subset of Go tests, e.g. task test-one -- ./db/ -run TestPinOrder'
    cmds:
      - go test {{.CLI_ARGS}}

  test-ci:
    desc: Run CI tests with coverage (excluding llm-shared)
    cmds:
      - go test -tags=ci -cover -v {{.GO_PACKAGES}} | tee coverage.out

  lint:
    desc: Run formatting and lint checks (excluding llm-shared)
    deps: [lint-web]
    cmds:
      - go fix {{.GO_PACKAGES}}
      - goimports -w $(find . -path ./llm-shared -prune -o -name '*.go' -print)
      - golangci-lint run ./...
      - |
        if [ "$(uname -s)" = "Darwin" ]; then
          task lint-apple
        fi

  vuln-go:
    desc: Scan import graph against the Go vulnerability DB (advisory, not gated on lint)
    cmds:
      - govulncheck {{.GO_PACKAGES}}

  deadcode-go:
    desc: Report unreachable Go functions (advisory; interface-compliance assertions can be false positives)
    cmds:
      - deadcode {{.GO_PACKAGES}}

  lint-web:
    desc: Type-check and lint the frontend
    cmds:
      - cd web && pnpm exec tsc --noEmit
      - cd web && pnpm lint:fix

  test-web:
    desc: Run the frontend unit test suite
    cmds:
      - cd web && pnpm test

  test-web-integration:
    desc: Run the frontend integration tests (requires seeded backend)
    cmds:
      - cd web && pnpm test:integration

  test-web-all:
    desc: Run frontend unit + integration tests
    cmds:
      - cd web && pnpm test:all

  tidy:
    desc: Tidy Go module dependencies
    cmds:
      - go mod tidy

  generate:
    desc: Regenerate sqlc Go code from db/{control,log,preview}_queries
    cmds:
      - sqlc generate

  clean:
    desc: Remove build artifacts and local data
    cmds:
      - rm -rf {{.BUILD_DIR}}
      - rm -rf web/dist
      - rm -rf data

  docker:
    desc: Build the Docker image
    cmds:
      - docker build --build-arg VERSION={{.VERSION}} --build-arg GIT_HASH={{.GIT_HASH}} --build-arg BUILD_TIME={{.BUILD_TIME}} -t {{.APP_NAME}} .

  up:
    desc: Start the docker compose stack
    cmds:
      - docker compose up -d --build

  down:
    desc: Stop the docker compose stack
    cmds:
      - docker compose down

  push:
    desc: Push current branch, then wait for CI and release workflows to succeed
    cmds:
      - ./scripts/push-and-watch.sh
