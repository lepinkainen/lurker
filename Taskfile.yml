version: '3'

vars:
  APP_NAME: lurker
  BUILD_DIR: build
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  GIT_HASH:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  BUILD_TIME:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -s -w
    -X main.version={{.VERSION}}
    -X main.gitHash={{.GIT_HASH}}
    -X main.buildTime={{.BUILD_TIME}}
  GO_PACKAGES:
    sh: go list ./... | grep -v '^github.com/lepinkainen/lurker/llm-shared/' | tr '\n' ' '

tasks:
  build:
    desc: Run lint, tests, frontend build, then build the local binary (quiet on success)
    silent: true
    cmds:
      - |
        LOG=$(mktemp); trap 'rm -f "$LOG"' EXIT
        step() {
          label=$1; shift
          printf "  %-12s" "$label"
          if "$@" >"$LOG" 2>&1; then echo "ok"; else echo "FAIL"; cat "$LOG"; exit 1; fi
        }
        step lint      task lint
        step test-go   task test
        step test-web  task test-web
        step web-build task web-build
        step build-tui task build-tui
        mkdir -p {{.BUILD_DIR}}
        step binary    go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.APP_NAME}} .
        echo "Build OK — lint, Go + web tests, web build, TUI + server binaries"

  build-linux:
    desc: Build the Linux binary into build/
    deps: [build-tui-linux]
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.APP_NAME}}-linux-amd64 .

  build-ci:
    desc: CI build with frontend assets
    deps: [web-build]
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.APP_NAME}} .

  dev:
    desc: Run the service locally
    cmds:
      - go run .

  tui:
    desc: Run the TUI client (reads tui-config.yaml or ~/.config/lurker/tui.yaml)
    cmds:
      - go run ./cmd/tui

  build-tui:
    desc: Build the TUI client binary to build/lurker-tui
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/lurker-tui ./cmd/tui

  build-tui-linux:
    desc: Build the TUI client Linux binary to build/lurker-tui-linux-amd64
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/lurker-tui-linux-amd64 ./cmd/tui

  dev-web:
    desc: Build the frontend then run backend via air (restarts 5s after Go edits settle)
    deps: [web-build]
    cmds:
      - air

  seed-test:
    desc: Seed ./data-test with fake networks, buffers, and messages
    cmds:
      - go run ./cmd/seedtest --data-dir ./data-test --reset

  dev-test:
    desc: Build the frontend then run backend against seeded ./data-test
    deps: [web-build]
    env:
      DATA_DIR: ./data-test
      CONFIG_PATH: /dev/null
    cmds:
      - go run . --web-dir ./web/dist

  web-install:
    desc: Install frontend dependencies with pnpm
    cmds:
      - cd web && pnpm install

  web-dev:
    desc: Run the Vite dev server for the frontend
    cmds:
      - cd web && pnpm dev

  gen-palette:
    desc: Generate web/src/nick-palette.ts with perceptually-spaced OKLCH hues
    cmds:
      - node scripts/gen-nick-palette.mjs
      - cd web && pnpm exec biome format --write src/nick-palette.ts

  web-build:
    desc: Build the frontend into web/dist
    deps: [gen-palette]
    cmds:
      - cd web && pnpm build

  test:
    desc: Run the test suite (excluding llm-shared)
    cmds:
      - go test {{.GO_PACKAGES}}

  test-ci:
    desc: Run CI tests with coverage (excluding llm-shared)
    cmds:
      - go test -tags=ci -cover -v {{.GO_PACKAGES}} | tee coverage.out

  lint:
    desc: Run formatting and lint checks (excluding llm-shared)
    deps: [lint-web]
    cmds:
      - goimports -w $(find . -path ./llm-shared -prune -o -name '*.go' -print)
      - golangci-lint run ./...

  vuln-go:
    desc: Scan import graph against the Go vulnerability DB (advisory, not gated on lint)
    cmds:
      - govulncheck {{.GO_PACKAGES}}

  deadcode-go:
    desc: Report unreachable Go functions (advisory; interface-compliance assertions can be false positives)
    cmds:
      - deadcode {{.GO_PACKAGES}}

  cognit-go:
    desc: Report Go funcs with cognitive complexity > 20 (advisory, requires jq)
    cmds:
      - |
        gocognit -over 20 -json $(find . \( -path ./llm-shared -o -path ./web/node_modules \) -prune -o -name '*.go' -print) \
          | jq -r '.[] | "\(.Pos.Filename):\(.Pos.Line): \(.FuncName) cognit=\(.Complexity)"'

  lint-web:
    desc: Type-check and lint the frontend
    cmds:
      - cd web && pnpm exec tsc --noEmit
      - cd web && pnpm lint:fix

  test-web:
    desc: Run the frontend test suite
    cmds:
      - cd web && pnpm test

  tidy:
    desc: Tidy Go module dependencies
    cmds:
      - go mod tidy

  clean:
    desc: Remove build artifacts and local data
    cmds:
      - rm -rf {{.BUILD_DIR}}
      - rm -rf web/dist
      - rm -rf data

  docker:
    desc: Build the Docker image
    cmds:
      - docker build --build-arg VERSION={{.VERSION}} --build-arg GIT_HASH={{.GIT_HASH}} --build-arg BUILD_TIME={{.BUILD_TIME}} -t {{.APP_NAME}} .

  up:
    desc: Start the docker compose stack
    cmds:
      - docker compose up -d --build

  down:
    desc: Stop the docker compose stack
    cmds:
      - docker compose down

  push:
    desc: Push current branch, then wait for CI and release workflows to succeed
    cmds:
      - ./scripts/push-and-watch.sh
